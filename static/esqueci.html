<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esqueceu a senha – Agenda Buffet</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: block;
            background: #000
        }

        .login {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            min-height: 100vh
        }

        .foto {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 44px;
            color: #fff;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, .2), rgba(0, 0, 0, .72)),
                url("img/login.jpg") center/cover no-repeat,
                linear-gradient(135deg, #000, #3a2800)
        }

        .foto p {
            margin: 12px 0 0;
            color: #e8dcc0;
            font-size: 14px;
            letter-spacing: .14em;
            text-transform: uppercase
        }

        .lado {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: var(--bg)
        }

        .caixa {
            width: 100%;
            max-width: 400px
        }

        .caixa h1 {
            font: 700 30px Georgia, serif;
            margin: 0 0 4px
        }

        .caixa .sub {
            color: var(--mut);
            margin: 0 0 22px
        }

        .caixa label {
            margin-top: 12px
        }

        .caixa .btn {
            width: 100%;
            margin: 24px 0 0
        }

        .caixa .btn:disabled {
            opacity: .6;
            cursor: wait
        }

        .erro {
            background: #fdecea;
            border: 1.5px solid var(--r);
            color: var(--r);
            border-radius: 10px;
            padding: 10px 12px;
            font-weight: 700;
            margin-bottom: 6px
        }

        .aviso {
            background: #edf7ee;
            border: 1.5px solid var(--g);
            color: #1b5e20;
            border-radius: 10px;
            padding: 10px 12px;
            font-weight: 600;
            margin-bottom: 6px
        }

        .voltar {
            text-align: center;
            margin: 18px 0 0
        }

        .voltar a {
            color: var(--gold-d);
            font-weight: 600
        }

        @media(max-width:800px) {
            .login {
                grid-template-columns: 1fr
            }

            .foto {
                min-height: 210px;
                padding: 26px
            }

            .lado {
                align-items: flex-start;
                padding: 28px 20px 44px
            }
        }
    </style>
</head>

<body>
    <div class="login">
        <div class="foto">
            <img src="img/logo.png" alt="Viernes Buffet" style="width:110px;height:110px;margin-bottom:8px">
            <p>Agenda de eventos</p>
        </div>
        <div class="lado">
            <form class="caixa" id="f">
                <h1>Esqueceu a senha?</h1>
                <p class="sub">Digite o e-mail da sua conta. Vamos enviar um link para você criar uma nova senha.</p>
                <div id="ok" class="aviso" hidden></div>
                <div id="erro" class="erro" hidden></div>
                <label><span>E-mail</span><input id="email" type="email" required autofocus
                        autocomplete="username"></label>
                <button class="btn" type="submit" id="enviar">Enviar link</button>
                <p class="voltar"><a href="login.html">Voltar para o login</a></p>
            </form>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id);
        const cookie = nome => {
            const m = document.cookie.match(new RegExp("(?:^|; )" + nome + "=([^;]*)"));
            return m ? decodeURIComponent(m[1]) : "";
        };

        $("f").addEventListener("submit", async ev => {
            ev.preventDefault();
            $("erro").hidden = true;
            $("ok").hidden = true;
            $("enviar").disabled = true;
            try {
                const r = await fetch("/api/esqueci-senha", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-XSRF-TOKEN": cookie("XSRF-TOKEN") },
                    body: JSON.stringify({ email: $("email").value.trim() })
                });
                if (!r.ok) throw new Error();
                $("ok").textContent = "Se esse e-mail estiver cadastrado, enviamos um link para redefinir a senha. " +
                    "Confira também a caixa de spam. O link vale por 30 minutos.";
                $("ok").hidden = false;
            } catch {
                $("erro").textContent = "Não foi possível enviar agora. Tente de novo em instantes.";
                $("erro").hidden = false;
            } finally {
                $("enviar").disabled = false;
            }
        });
    </script>
</body>

</html>
